name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
        - dev
        - prod
        default: dev
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev/prod)'
        required: true
        type: string
    secrets:
      SERVER_HOST:
        required: true
      SERVER_PASSWORD:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DISCORD_WEBHOOK:
        required: true
      ENV_FILE_CONTENT:
        required: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.short }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract commit SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push API
      uses: docker/build-push-action@v5
      with:
        context: .
        target: api
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/retoday-api:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/retoday-api:${{ steps.sha.outputs.short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Batch
      uses: docker/build-push-action@v5
      with:
        context: .
        target: batch
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/retoday-batch:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/retoday-batch:${{ steps.sha.outputs.short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Discord - Build
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        title: "🔨 [${{ inputs.environment }}] Build"
        description: |
          **Status:** ${{ job.status == 'success' && '✅' || '❌' }}
          **Branch:** `${{ github.ref_name }}`
          **Commit:** `${{ steps.sha.outputs.short }}`
          **Built:** 🔹API 🔹Batch
        color: ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}

  deploy:
    name: Deploy
    needs: build-and-push
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ needs.build-and-push.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup and copy files
      uses: appleboy/ssh-action@v1.0.3
      env:
        ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: root
        password: ${{ secrets.SERVER_PASSWORD }}
        envs: ENV_CONTENT
        script: |
          mkdir -p ~/retoday
          printf '%s\n' "$ENV_CONTENT" > ~/retoday/.env
          chmod 600 ~/retoday/.env

    - name: Copy docker-compose.yml
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: root
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "docker-compose.yml"
        target: "~/retoday"
        overwrite: true

    - name: Deploy services
      uses: appleboy/ssh-action@v1.0.3
      env:
        DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        SHA: ${{ needs.build-and-push.outputs.sha }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: root
        password: ${{ secrets.SERVER_PASSWORD }}
        envs: DOCKER_USER,SHA
        script: |
          set -e
          cd ~/retoday

            echo "=== Deploying API ==="
            docker pull ${DOCKER_USER}/retoday-api:${SHA}
            docker images retoday-api:latest -q | grep -q . && docker tag retoday-api:latest retoday-api:previous || true
            docker tag ${DOCKER_USER}/retoday-api:${SHA} retoday-api:latest

            docker compose up -d --force-recreate api

            # Health check
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "✅ API healthy after $((i * 10))s"
                break
              fi
              [ $i -eq 12 ] && {
                echo "❌ API health check failed"
                docker logs retoday-api --tail 50
                docker images retoday-api:previous -q | grep -q . && {
                  docker tag retoday-api:previous retoday-api:latest
                  docker compose up -d api
                  echo "⚠️ Rolled back API"
                }
                exit 1
              }
              sleep 10
            done

            echo "=== Deploying Batch ==="
            docker pull ${DOCKER_USER}/retoday-batch:${SHA}
            docker images retoday-batch:latest -q | grep -q . && docker tag retoday-batch:latest retoday-batch:previous || true
            docker tag ${DOCKER_USER}/retoday-batch:${SHA} retoday-batch:latest

            docker compose up -d --force-recreate batch

            # Health check
            sleep 10
            if ! docker ps --filter "name=retoday-batch" --filter "status=running" | grep -q retoday-batch; then
              echo "❌ Batch failed to start"
              docker logs retoday-batch --tail 50
              docker images retoday-batch:previous -q | grep -q . && {
                docker tag retoday-batch:previous retoday-batch:latest
                docker compose up -d batch
                echo "⚠️ Rolled back Batch"
              }
              exit 1
            fi
            echo "✅ Batch running"

          # Cleanup
          docker image prune -f --filter "until=24h" || true
          echo "✅ Deployment complete"

    - name: Discord - Deploy
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        title: "🚀 [${{ inputs.environment }}] Deploy"
        description: |
          **Status:** ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
          **Branch:** `${{ github.ref_name }}`
          **Commit:** `${{ needs.build-and-push.outputs.sha }}`
        color: ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}
