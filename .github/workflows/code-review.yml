name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install GoogleGenerativeAI
        run: npm install @google/generative-ai

      - name: Get git diff for PR
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git diff "origin/${{ github.event.pull_request.base.ref }}"..."origin/${{ github.event.pull_request.head.ref }}" > diff.txt

      - name: Run Gemini Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require("fs");
            const { GoogleGenerativeAI } = require("@google/generative-ai");

            // 1. Diff 읽기
            let diff_output;
            try {
              diff_output = fs.readFileSync("diff.txt", "utf8");
            } catch (error) { return; }

            if (diff_output.length > 20000) {
              diff_output = diff_output.substring(0, 20000) + "\n...(truncated)";
            }

            // 2. Gemini 초기화
            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);

            // 제미나이 모델 : gemini-flash-latest
            const model = genAI.getGenerativeModel({ model: "gemini-flash-latest" });

            // 제미나이 프롬프트
            const prompt = `
            Role: Senior Backend Software Engineer
            Task: Review the provided git diff in **Korean**.

            [Review Guidelines]
            1. **Analyze**: Review the code **file-by-file**, understanding the logic changes.
            2. **Focus**: Logic bugs, security risks, performance, and code structure (SRP).
            3. **Ignore**: Minor styling/formatting issues (indentation, spacing).

            [Conciseness & Length Control] - **IMPORTANT**
            1. **No Filler**: Do not write unnecessary introductions or filler words. Get straight to the point.
            2. **Adaptive Length**: 
               - For **complex/critical** changes: You may explain in detail.
               - For **trivial/minor** changes: Keep the review extremely short (1-2 sentences). **Do not fill up space just to reach a limit.**
            3. **Maximum Constraint**: Keep the entire review concise and efficient to read.

            [Output Format - Please follow strictly]

            ### ✅ 변경 사항 요약
            - (Briefly summarize changes in 1-3 bullet points.)

            ### 🚨 치명적인 이슈 (Critical Issues)
            - **IMPORTANT**: Only include this section if there are **actual bugs, security risks, or fatal performance issues**.
            - **If there are NO critical issues, DO NOT write this section header.**
            - Format:
              - 🛑 **[File/Class Name]**
                - **Problem**: (Explain the bug/risk)
                - **Fix**: (Proposed solution)

            ### ✏️ 파일별 상세 리뷰
            - Provide feedback for changed files.
            - **Skip** unchanged or trivial files if there is nothing meaningful to say.
            - **Format**:
              #### \`File Name / Class Name\`
              - 📍 **Review**: (Logic analysis. Keep it short for simple changes.)
              - ✨ **Improvement**: (Only if necessary)

            ---
            
            [Git Diff Data]
            ${diff_output}
            `;

            // 3. 재시도 로직 (429 Too Many Requests 대응)
            async function generateWithRetry(retryCount = 0) {
              try {
                const result = await model.generateContent(prompt);
                const response = await result.response;
                return response.text();
              } catch (error) {
                if (error.message.includes("429") || error.message.includes("Too Many Requests")) {
                  if (retryCount < 2) {
                    console.log(`Rate limit hit. Waiting 15 seconds before retry`);
                    await new Promise(resolve => setTimeout(resolve, 15000)); // 15초 대기
                    return generateWithRetry(retryCount + 1);
                  }
                }
                throw error;
              }
            }

            // txt파일로 저장
            try {
              const text = await generateWithRetry();
            
              const finalComment = `
              ## 🤖 Gemini Code Review
            
              ${text}
              `;
              fs.writeFileSync("review_result.txt", finalComment);

            } catch (error) {
              console.error("Final Error:", error);
              // 실패 시 에러 원인 댓글에 남김
              fs.writeFileSync("review_result.txt", `❌ Review Failed: ${error.message}`);
            }

      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let body;
            try {
              body = fs.readFileSync("review_result.txt", "utf8");
            } catch (e) { return; }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });