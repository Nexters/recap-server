spring:
  application:
    name: retoday-api
  main:
    banner-mode: off
  profiles:
    include:
    - auth
    - db
  web:
    resources:
      add-mappings: false
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read_only
logging:
  config: classpath:log4j2-${spring.profiles.active}.yaml
---
spring:
  config:
    activate:
      on-profile: local
web:
  uri: http://localhost:3000
---
spring:
  config:
    activate:
      on-profile:
      - dev
      - prod
web:
  uri: ${WEB_URI}
