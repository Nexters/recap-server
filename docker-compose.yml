services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: recap-api:latest
    container_name: recap-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  batch:
    build:
      context: .
      dockerfile: Dockerfile
      target: batch
    image: recap-batch:latest
    container_name: recap-batch
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    env_file:
      - .env
    restart: unless-stopped
