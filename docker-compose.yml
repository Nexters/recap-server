services:
  db:
    image: mysql:8.0
    container_name: retoday-db
    environment:
    - MYSQL_ROOT_PASSWORD=${MAIN_DB_PASSWORD}
    - MYSQL_DATABASE=${MAIN_DB_NAME:-retoday}
    volumes:
    - mysql-data:/var/lib/mysql
    ports:
    - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: retoday-api:latest
    container_name: retoday-api
    ports:
    - "8080:8080"
    environment:
    - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    env_file:
    - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  batch:
    image: retoday-batch:latest
    container_name: retoday-batch
    environment:
    - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    env_file:
    - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
